# ============================================================
# ExploreScholar_Digest — 配额与语种配比
# ============================================================

quotas:
  fundamental:
    label: "财务基本面因子"
    total: 20
    en: 12
    zh: 8
    subcategories:
      - "价值因子 (B/P, E/P, C/P, D/P)"
      - "质量因子 (ROE, ROA, F-Score, GP/Assets)"
      - "盈利/成长因子"
      - "应计/NOA因子"
      - "杠杆/DuPont因子"
      - "现金流因子"
      - "财务困境因子"

  momentum:
    label: "动量因子"
    total: 10
    en: 6
    zh: 4
    subcategories:
      - "价格动量 (短期/中期/长期)"
      - "残差动量"
      - "行业动量"
      - "反转效应"
      - "趋势信号"
      - "52周高低/移动平均交叉"

  alternative:
    label: "另类数据因子"
    total: 5
    en: 3
    zh: 2
    subcategories:
      - "舆情文本 (NLP/LLM)"
      - "卫星图像"
      - "供应链网络"
      - "社交媒体情绪"
      - "ESG信号 (需生成选股信号)"
      - "分析师报告文本"
      - "机构持仓变化"

# ── 语种配比 ──
language_ratio:
  en: 0.60    # 英文文献 60%：海外前沿研究主阵地
  zh: 0.40    # 中文文献 40%：A股市场特有异象 + 国内券商金工
  rationale: |
    英文文献为海外前沿研究主阵地（SSRN/NBER/arXiv/顶刊），
    方法轮创新和因子发现的主要来源。
    中文文献覆盖A股市场特有异象、中国制度背景因子、
    国内券商金工研报，确保研究不脱离本土市场实际。

# ── 选取优先级权重 ──
selection_weights:
  novelty: 0.40          # 新颖性：2025-2026年发表、因子构造方法创新
  replicability: 0.35    # 可复现性：数据源在Gildata中有对应字段、公式明确
  significance: 0.25     # 成果显著性：IC/IR/Sharpe等指标突出

# ── 最小/最大约束 ──
constraints:
  min_per_category:       # 每个因子大类至少选取
    fundamental: 15
    momentum: 7
    alternative: 3
  max_per_source:         # 每个来源最多选取（防止某来源过度集中）
    arxiv: 25
    ssrn: 10
    nber: 8
    journals: 8
  min_year: 2023          # 最早发表年份（太旧的论文排除）
  prefer_year: 2025       # 优先选取此年份之后的论文

# ── 回退策略（如果候选池不足） ──
fallback:
  if_shortfall:
    fundamental:
      relax_year: true    # 放宽年份限制 → 2022
      relax_source: true  # 放宽来源限制
    momentum:
      relax_year: true
      include_industry_momentum: true  # 纳入行业动量（边界情况）
    alternative:
      relax_constraints: true          # 降低筛选标准
      allow_borderline: true           # 允许边界论文（2个YES的）
  max_relax_iterations: 2              # 最多放宽 2 轮

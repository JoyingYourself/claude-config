# ============================================================
# ExploreScholar_Digest — 范围限定关键词（双层过滤第一层）
# 白名单 ~80 词 | 黑名单 ~60 词
# 匹配逻辑：title + abstract 联合匹配
# 优先级：白名单 > 黑名单（既匹配白又匹配黑 → 保留）
# ============================================================

# ── 白名单（权益市场横截面收益预测相关）──
whitelist_keywords:
  # === 核心定位词（必留） ===
  - "stock return predictability"
  - "cross-section of stock returns"
  - "cross-sectional stock return"
  - "equity factor"
  - "stock selection"
  - "stock picking"
  - "equity anomaly"
  - "stock market anomaly"
  - "asset pricing anomaly"
  - "return predictability"
  - "predicting stock returns"
  - "forecasting stock returns"
  - "equity risk premium"
  - "expected stock return"
  - "alpha generation"

  # === 因子大类关键词 ===
  # 价值因子
  - "book-to-market"
  - "earnings yield"
  - "dividend yield"
  - "cash flow yield"
  - "price to earnings"
  - "price to book"
  - "enterprise value"
  - "value premium"
  - "value factor"
  - "value investing"

  # 动量因子
  - "price momentum"
  - "return momentum"
  - "momentum factor"
  - "momentum strategy"
  - "momentum effect"
  - "trend following"
  - "moving average"
  - "time-series momentum"
  - "cross-sectional momentum"
  - "residual momentum"
  - "short-term reversal"
  - "long-term reversal"
  - "52-week high"

  # 质量因子
  - "profitability factor"
  - "quality factor"
  - "return on equity"
  - "return on asset"
  - "gross profitability"
  - "F-Score"
  - "Piotroski"
  - "accruals"
  - "earnings quality"
  - "operating profitability"

  # 低波动/低风险
  - "low volatility"
  - "low beta"
  - "minimum variance"
  - "volatility anomaly"
  - "betting against beta"
  - "idiosyncratic volatility"

  # 规模/流动性
  - "size effect"
  - "small-cap premium"
  - "market capitalization"
  - "liquidity factor"
  - "illiquidity premium"
  - "trading volume"

  # 情绪/行为
  - "investor sentiment"
  - "analyst coverage"
  - "analyst forecast"
  - "short interest"
  - "institutional ownership"
  - "insider trading"

  # 技术/信号
  - "technical indicator"
  - "trading signal"
  - "chart pattern"
  - "technical analysis"

  # 另类数据
  - "alternative data"
  - "text analysis"
  - "natural language processing"
  - "machine learning"
  - "neural network"
  - "sentiment analysis"
  - "news sentiment"
  - "social media"
  - "satellite imagery"

  # 中国市场/A股
  - "A-share"
  - "Chinese stock market"
  - "China equity"
  - "China stock"
  - "Shanghai Stock Exchange"
  - "Shenzhen Stock Exchange"
  - "CSRC"

  # 方法论词
  - "portfolio construction"
  - "factor model"
  - "factor investing"
  - "smart beta"
  - "risk parity"
  - "stock screening"
  - "quantitative equity"
  - "quant equity"

# ── 黑名单（排除范围：衍生品/固收/加密货币/宏观理论/非A股公开市场）──
blacklist_keywords:
  # === 衍生品 ===
  - "option pricing"
  - "option market"
  - "option implied"
  - "futures pricing"
  - "futures market"
  - "derivatives market"
  - "stochastic volatility"
  - "VIX"
  - "volatility surface"
  - "credit default swap"  # CDS
  - "interest rate swap"
  - "swaption"

  # === 固定收益 ===
  - "bond market"
  - "bond return"
  - "bond portfolio"
  - "sovereign debt"
  - "corporate bond"
  - "treasury bond"
  - "yield curve"
  - "credit spread"
  - "credit risk"
  - "term structure"
  - "duration"
  - "fixed income"

  # === 加密货币 ===
  - "cryptocurrency"
  - "bitcoin"
  - "blockchain"
  - "ethereum"
  - "crypto"
  - "token"
  - "DeFi"
  - "NFT"

  # === 外汇 ===
  - "foreign exchange"
  - "exchange rate"
  - "FX market"
  - "currency market"
  - "currency carry trade"

  # === 宏观经济理论 ===
  - "DSGE"
  - "dynamic stochastic general equilibrium"
  - "Taylor rule"
  - "monetary policy"
  - "fiscal policy"
  - "inflation targeting"
  - "endogenous growth"
  - "macroeconomic"
  - "GDP growth"
  - "business cycle"

  # === 公司金融理论（不涉及因子的） ===
  - "capital structure theory"
  - "M&A"
  - "merger and acquisition"
  - "corporate governance"
  - "board structure"
  - "CEO compensation"

  # === 银行/保险监管 ===
  - "Basel"
  - "Solvency"
  - "capital adequacy"
  - "bank regulation"
  - "financial regulation"
  - "systemic risk"

  # === 高频做市 ===
  - "market making"
  - "high-frequency trading"
  - "HFT"
  - "order book"
  - "bid-ask spread"
  - "limit order"
  - "market microstructure"

  # === 非权益资产类别 ===
  - "real estate"
  - "REIT"
  - "venture capital"
  - "private equity"
  - "commodity futures"
  - "infrastructure"
  - "PPP"

  # === 纯计量方法（非因子发现） ===
  - "new t-test"
  - "standard error"
  - "bootstrap"
  - "instrumental variable"
  - "difference-in-difference"
  - "regression discontinuity"

  # === ESG（除非生成选股信号） ===
  - "ESG rating"
  - "ESG score"
  - "carbon emission"
  - "climate risk"
  - "sustainability"
  - "green bond"

# ── 过滤配置 ──
filter:
  match_fields: ["title", "abstract"]
  match_mode: "any"          # any whitelist keyword → keep
  case_sensitive: false
  min_abstract_length: 50    # Skip papers with < 50 char abstract (likely incomplete)
  skip_non_english_no_abstract: true  # Papers without English abstract

# ── 白名单与黑名单重叠处理 ──
# 当一篇论文同时匹配白名单和黑名单关键词时:
overlap_resolution: "whitelist_wins"
# 原因: 例如 "machine learning for stock selection using option data"
# → ML + stock selection (白) + option pricing (黑) → 保留（白名单优先）
# 后续 LLM 三问审核会进一步判断

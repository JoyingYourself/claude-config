<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工作日志 — __DATE__</title>
<style>
  :root {
    --bg: #0d1117; --bg-secondary: #161b22; --bg-tertiary: #21262d;
    --border: #30363d; --text: #c9d1d9; --text-secondary: #8b949e;
    --text-muted: #6e7681; --accent: #58a6ff; --accent2: #f0883e;
    --green: #3fb950; --yellow: #d2991d; --red: #f85149; --purple: #a371f7;
    --code-bg: #1c2128;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.6;
    max-width: 960px; margin: 0 auto; padding: 2rem 1.5rem;
  }
  h1 { font-size: 2rem; border-bottom: 1px solid var(--border); padding-bottom: 0.6rem; margin-bottom: 1rem; }
  h1 small { font-size: 1rem; color: var(--text-secondary); font-weight: 400; }
  h2 { font-size: 1.5rem; margin-top: 2.5rem; margin-bottom: 1rem; padding-bottom: 0.4rem; border-bottom: 1px solid var(--border); }
  h3 { font-size: 1.2rem; margin-top: 2rem; margin-bottom: 0.6rem; color: var(--accent); }
  h4 { font-size: 1rem; margin-top: 1.5rem; margin-bottom: 0.5rem; }
  p { margin: 0.8rem 0; }
  strong { color: #e6edf3; }
  code {
    font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'JetBrains Mono', monospace;
    font-size: 0.85em; background: var(--code-bg); padding: 0.15em 0.4em;
    border-radius: 4px; border: 1px solid var(--border);
  }
  pre {
    background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px;
    padding: 1rem 1.2rem; overflow-x: auto; margin: 1rem 0; font-size: 0.82rem; line-height: 1.55;
  }
  pre code { background: none; border: none; padding: 0; }
  table { width: 100%; border-collapse: collapse; margin: 1rem 0; font-size: 0.9rem; }
  th, td { border: 1px solid var(--border); padding: 0.55rem 0.8rem; text-align: left; }
  th { background: var(--bg-tertiary); font-weight: 600; white-space: nowrap; }
  tr:nth-child(even) { background: var(--bg-secondary); }
  hr { border: none; border-top: 1px solid var(--border); margin: 2rem 0; }
  blockquote { border-left: 3px solid var(--text-muted); margin: 1rem 0; padding: 0.5rem 1rem; background: var(--bg-secondary); border-radius: 0 6px 6px 0; color: var(--text-secondary); }
  ul { margin: 0.8rem 0; padding-left: 1.5rem; }
  li { margin: 0.3rem 0; }
  @media (max-width: 768px) { body { padding: 1rem; } pre { font-size: 0.75rem; padding: 0.8rem; } table { font-size: 0.78rem; } }
</style>
</head>
<body>

<h1>工作日志 — __DATE__</h1>
{{CONTENT}}

</body>
</html>
